# Fork deployment override.
#
# Use together with docker-compose.local.yml:
#   docker compose -f docker-compose.local.yml -f docker-compose.fork.yml up -d
#
# The base file keeps the upstream service definitions and local-directory
# persistence. This override replaces only the application image with a build
# from the checked-out fork and applies low-memory server defaults.

services:
  sub2api:
    image: "${SUB2API_IMAGE:-sub2api-fork}:${SUB2API_IMAGE_TAG:-git}"
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:24-alpine}"
        GOLANG_IMAGE: "${GOLANG_IMAGE:-golang:1.26.5-alpine}"
        ALPINE_IMAGE: "${ALPINE_IMAGE:-alpine:3.21}"
        POSTGRES_IMAGE: "${POSTGRES_IMAGE:-postgres:18-alpine}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}"
        NODE_MAX_OLD_SPACE_SIZE: "${NODE_MAX_OLD_SPACE_SIZE:-2048}"
    environment:
      - SERVER_MAX_REQUEST_BODY_SIZE=${SERVER_MAX_REQUEST_BODY_SIZE:-67108864}
      - GATEWAY_MAX_BODY_SIZE=${GATEWAY_MAX_BODY_SIZE:-67108864}

  postgres:
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
